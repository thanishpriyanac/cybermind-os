version: '3.8'

services:
  test-postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: cybermind_test
      POSTGRES_PASSWORD: testpassword
      POSTGRES_DB: cybermind_test_db
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cybermind_test"]
      interval: 5s
      timeout: 5s
      retries: 5

  test-redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

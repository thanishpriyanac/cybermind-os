global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: 'prometheus'
    static_configs:
      - targets: ['localhost:9090']

  - job_name: 'otel-collector'
    static_configs:
      - targets: ['otel-collector:8889']

  # Next.js services expose Prometheus metrics by default on /metrics or via custom server
  - job_name: 'cybermind-gateway'
    metrics_path: '/api/metrics'
    static_configs:
      - targets: ['gateway:3000']
